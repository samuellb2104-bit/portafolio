<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description | strip_newlines }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ '/' | relative_url }}">Samuel López Bonilla</a>
        <nav class="site-nav">
          <a class="nav-link" href="{{ '/about/' | relative_url }}">About</a>
          <label class="dark-toggle" title="Toggle dark mode">
            <input type="checkbox" id="dark-mode-toggle">
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-icon">🌙</span>
          </label>
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p>© {{ site.time | date: '%Y' }} Samuel López Bonilla</p>
        <div class="footer-links">
          <a class="text-link" href="https://github.com/samuellb2104-bit" target="_blank" rel="noopener">GitHub ↗</a>
          <a class="text-link" href="https://linkedin.com/in/samuel-lópez-bonilla-1b624b300/?skipRedirect=true" target="_blank" rel="noopener">LinkedIn ↗</a>
        </div>
      </div>
    </footer>
    <script src="{{ '/assets/js/carousel.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/darkmode.js' | relative_url }}"></script>
  </body>
</html>
