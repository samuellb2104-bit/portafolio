<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <a class="nav-link" href="{{ '/about/' | relative_url }}">About Me</a>
          <label class="dark-toggle" title="Toggle dark mode">
            <input type="checkbox" id="dark-mode-toggle">
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-icon">🌙</span>
          </label>
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p>© {{ site.time | date: '%Y' }} {{ site.title }}</p>
      </div>
    </footer>
    <script src="{{ '/assets/js/carousel.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/darkmode.js' | relative_url }}"></script>
  </body>
</html>
