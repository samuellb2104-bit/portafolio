# Build settings
theme: minima
plugins:
  - jekyll-feed

# Minima customization
minima:
  skin: dark
  date_format: "%b %d, %Y"

# Collections
collections:
  projects:
    output: true
    permalink: /proyectos/:slug

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .git
  - .gitignore
